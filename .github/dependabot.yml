version: 2
updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /native
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"
