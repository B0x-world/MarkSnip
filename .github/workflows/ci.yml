name: CI

# PR + manual only. Merges to main would otherwise re-run the same checks
# that already ran on the pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect E2E-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - "src/**"
              - "!docs/*.md"
              - "src/tests/e2e/**"
              - "src/playwright.config.js"
              - "src/package.json"
              - "src/package-lock.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/firefox-verification.yml"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Resolve Playwright version
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        id: playwright
        working-directory: src
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Run unit tests
        working-directory: src
        run: npm run test:unit

      - name: Run integration tests
        working-directory: src
        run: npm run test:integration

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: npx playwright install --with-deps chromium

      - name: Run deterministic E2E tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: xvfb-run -a npx playwright test tests/e2e/extension.spec.js tests/e2e/notifications.spec.js tests/e2e/batch-processing.spec.js tests/e2e/command-download-regression.spec.js

  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Check version sync
        working-directory: src
        run: npm run check:version-sync

      - name: Check file metadata headers
        working-directory: src
        run: npm run check:file-metadata

      - name: Run ESLint
        working-directory: src
        run: npm run lint:js

      - name: Generate browser manifests
        working-directory: src
        run: npm run build:manifests

      - name: Run web-ext lint (Firefox)
        working-directory: src
        run: node scripts/run-web-ext.js lint -s .build/firefox
