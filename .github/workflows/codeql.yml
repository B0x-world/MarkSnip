# CodeQL advanced setup
#
# Advanced CodeQL workflow (github/codeql-action@v4). Default setup must be
# disabled in the repository settings UI; this file does not work around that.
# After default setup is off, PR checks can diff against analyses on `main`.
#
# Languages match what default setup was already scanning on this repo
# (javascript-typescript, go, swift) plus GitHub Actions YAML. Job names stay
# `Analyze (<language>)` so any required checks named that way keep resolving.
#
# The Safari wrapper under xcode/MarkSnip is scanned as Swift via a manual
# unsigned xcodebuild (generate src/.build/safari, then build-safari-app.sh).
# The release workflow can also package it when build_safari is enabled.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && (vars.RUNNER_MACOS || 'macos-latest')) || (vars.RUNNER_LINUX || 'ubuntu-latest') }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: swift
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup Node.js
        if: matrix.build-mode == 'manual'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Build Safari wrapper (unsigned)
        if: matrix.build-mode == 'manual'
        env:
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          (cd src && npm ci && npm run build:manifests)
          bash xcode/build-safari-app.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
