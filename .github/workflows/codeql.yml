# CodeQL advanced setup
#
# Advanced CodeQL workflow (github/codeql-action@v4). Default setup must be
# disabled in the repository settings UI; this file does not work around that.
# After default setup is off, PR checks can diff against analyses on `main`.
#
# Default languages are javascript-typescript, go, and GitHub Actions YAML.
# Swift stays out of the matrix unless ENABLE_MACOS is the string true or the
# enable_macos dispatch input is true. Then Analyze (swift) runs on macos-*
# using a manual unsigned xcodebuild (generate src/.build/safari, then
# build-safari-app.sh). Without that switch the Swift job is skipped.

name: CodeQL

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_macos:
        description: "Opt in to Analyze (swift) on a macos runner (or set ENABLE_MACOS=true)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Resolve analysis scope
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      swift: ${{ steps.set.outputs.swift }}
    steps:
      - name: Checkout repository
        if: |
          (vars.ENABLE_MACOS == 'true' || inputs.enable_macos == true) &&
          (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/checkout@v7

      - name: Detect Swift-relevant changes
        id: filter
        if: |
          (vars.ENABLE_MACOS == 'true' || inputs.enable_macos == true) &&
          (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - "xcode/**"
              - "**/*.swift"
              - "src/scripts/generate-browser-manifests.js"
              - ".github/scripts/resolve-release-outputs.py"
              - ".github/workflows/build-release.yml"
              - ".github/workflows/build-release-pc-mac.yml"
              - ".github/workflows/codeql.yml"

      - name: Set Swift analysis toggle
        id: set
        env:
          ENABLE_MACOS_VAR: ${{ vars.ENABLE_MACOS }}
          ENABLE_MACOS_INPUT: ${{ inputs.enable_macos }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SWIFT_PATHS: ${{ steps.filter.outputs.swift }}
        run: |
          set -euo pipefail
          macos=false
          if [ "${ENABLE_MACOS_VAR}" = "true" ] || [ "${ENABLE_MACOS_INPUT}" = "true" ]; then
            macos=true
          fi
          if [ "$macos" != "true" ]; then
            echo "swift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] || { [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; }; then
            echo "swift=${SWIFT_PATHS:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "swift=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Build Safari wrapper (unsigned)
        env:
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          (cd src && npm ci && npm run build:manifests)
          bash xcode/build-safari-app.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
