name: Firefox Verification

# PR + manual only. Merges to main would otherwise re-run the same checks
# that already ran on the pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  focused:
    name: Firefox Build and Focused Regression Tests
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect E2E-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - "src/**"
              - "!docs/*.md"
              - "src/tests/e2e/**"
              - "src/playwright.config.js"
              - "src/package.json"
              - "src/package-lock.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/firefox-verification.yml"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Resolve Playwright version
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        id: playwright
        working-directory: src
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Run focused Firefox unit and integration tests
        working-directory: src
        run: npm run test:firefox:focused

      - name: Generate browser manifests
        working-directory: src
        run: npm run build:browser-manifests

      - name: Run web-ext lint (Firefox)
        working-directory: src
        run: node scripts/run-web-ext.js lint -s .build/firefox

      - name: Install Playwright Firefox
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: npx playwright install --with-deps firefox

      - name: Run Firefox live smoke
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: node scripts/run-firefox-live-smoke.js --headless

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: npx playwright install --with-deps chromium

      - name: Run deterministic MathML extension test
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: xvfb-run -a npm run test:e2e:mathml

      - name: Run Firefox offscreen bridge regression test
        if: github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true'
        working-directory: src
        run: xvfb-run -a npx playwright test tests/e2e/command-download-regression.spec.js -g "Firefox fallback"

  live-snapshots:
    name: Live Snapshot Regression
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        working-directory: src
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        working-directory: src
        run: npx playwright install --with-deps chromium

      - name: Run default live markdown snapshots
        working-directory: src
        run: xvfb-run -a npm run snapshot:live-markdown

      - name: Upload live snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-verification-live-snapshots
          path: src/test-artifacts/live-markdown-comparisons/
