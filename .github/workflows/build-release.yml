# Build and Release Extension
#
# workflow_dispatch has 10 inputs (GitHub's limit), in form order:
#   architectures, helpers, extensions, mac, pc, chrome, edge, firefox,
#   publish_release, debug.
# Helper OS/arch cells come from `helpers` + `pc`/`mac` + `architectures`.
# Safari and macOS helpers also need ENABLE_MACOS=true or enable_macos (the
# Mac checkbox on dispatch). Tag pushes enable non-Mac outputs and publish.
# Pull requests force Firefox + Chrome + Edge (helpers off, no publish).
#
# Debug is build-time only. When false, source maps, logger.debug call sites,
# and shared/build-config.js are stripped from packaged extensions. Warn, error,
# and a small set of info logs remain. Tag releases and publish_release=true
# always build with debug off.
#
# Safari builds the MarkSnip Xcode wrapper at xcode/MarkSnip/. Display names
# are MarkSnip; bundle IDs stay au.death.MarkDownload /
# au.death.MarkDownload.Extension. It embeds src/.build/safari. Builds are
# unsigned (CODE_SIGNING_ALLOWED=NO).
#
# The release job downloads whatever artifacts exist and attaches only those.

name: Build and Release Extension

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      architectures:
        description: "Native host architectures (x64, arm64, or all)"
        type: choice
        options:
          - all
          - x64
          - arm64
        default: all
      helpers:
        description: "Native host helpers (Agent Bridge)"
        type: boolean
        default: true
      extensions:
        description: "Extensions"
        type: boolean
        default: true
      mac:
        description: "Mac target: Safari wrapper plus macOS helpers (also needs ENABLE_MACOS=true)"
        type: boolean
        default: false
      pc:
        description: "PC target: Windows and Linux helpers"
        type: boolean
        default: true
      chrome:
        description: "Chrome extension (.zip)"
        type: boolean
        default: true
      edge:
        description: "Edge extension (.zip; same Chromium package as Chrome, separately named)"
        type: boolean
        default: true
      firefox:
        description: "Firefox extension (.xpi)"
        type: boolean
        default: true
      publish_release:
        description: "Create or update the GitHub Release (tag pushes always publish)"
        type: boolean
        default: true
      debug:
        description: "Build-time debug: keep source maps and logger.debug calls (forced off when publishing)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g., v4.0.1)"
        required: false
        type: string
        default: ""
      architectures:
        description: "Native host architectures (x64, arm64, or all)"
        type: string
        default: all
      helpers:
        description: "Native host helpers (Agent Bridge)"
        type: boolean
        default: true
      extensions:
        description: "Extensions"
        type: boolean
        default: true
      mac:
        description: "Mac target: Safari wrapper plus macOS helpers"
        type: boolean
        default: false
      pc:
        description: "PC target: Windows and Linux helpers"
        type: boolean
        default: true
      chrome:
        description: "Chrome extension (.zip)"
        type: boolean
        default: true
      edge:
        description: "Edge extension (.zip; same Chromium package as Chrome, separately named)"
        type: boolean
        default: true
      firefox:
        description: "Firefox extension (.xpi)"
        type: boolean
        default: true
      enable_macos:
        description: "Allow Safari/macOS runners (or set ENABLE_MACOS=true)"
        type: boolean
        default: false
      publish_release:
        description: "Create or update the GitHub Release"
        type: boolean
        default: false
      debug:
        description: "Build-time debug: keep source maps and logger.debug calls (forced off when publishing)"
        type: boolean
        default: false

# Do not use github.workflow in this group. In a reusable workflow that
# context is the *caller* name, so it would match the preset's group
# (e.g. "Build and Release (PC)-refs/heads/main") and GitHub would cancel
# both as a deadlock. A fixed prefix plus PR number or run_id keeps
# presets, tag pushes, and dispatch runs on distinct groups. PRs still
# share a group so a new push cancels the previous packaging run.
concurrency:
  group: build-release-extension-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build toggles
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      firefox: ${{ steps.resolve.outputs.firefox }}
      chrome: ${{ steps.resolve.outputs.chrome }}
      edge: ${{ steps.resolve.outputs.edge }}
      safari: ${{ steps.resolve.outputs.safari }}
      windows_amd64: ${{ steps.resolve.outputs.windows_amd64 }}
      windows_arm64: ${{ steps.resolve.outputs.windows_arm64 }}
      linux_amd64: ${{ steps.resolve.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.resolve.outputs.linux_arm64 }}
      macos_amd64: ${{ steps.resolve.outputs.macos_amd64 }}
      macos_arm64: ${{ steps.resolve.outputs.macos_arm64 }}
      helper_matrix: ${{ steps.resolve.outputs.helper_matrix }}
      helper_count: ${{ steps.resolve.outputs.helper_count }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      debug: ${{ steps.resolve.outputs.debug }}
      artifact_suffix: ${{ steps.resolve.outputs.artifact_suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Safari-relevant changes
        id: safari_paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            safari:
              - "xcode/**"
              - "**/*.swift"
              - "src/scripts/generate-browser-manifests.js"
              - ".github/scripts/resolve-release-outputs.py"
              - ".github/workflows/build-release.yml"
              - ".github/workflows/build-release-pc-mac.yml"
              - ".github/workflows/codeql.yml"

      - name: Resolve enabled outputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_HELPERS: ${{ inputs.helpers }}
          INPUT_EXTENSIONS: ${{ inputs.extensions }}
          INPUT_MAC: ${{ inputs.mac }}
          INPUT_PC: ${{ inputs.pc }}
          INPUT_CHROME: ${{ inputs.chrome }}
          INPUT_EDGE: ${{ inputs.edge }}
          INPUT_FIREFOX: ${{ inputs.firefox }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          INPUT_DEBUG: ${{ inputs.debug }}
          INPUT_ARCHITECTURES: ${{ inputs.architectures }}
          INPUT_ENABLE_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.mac || inputs.enable_macos }}
          SAFARI_RELEVANT: ${{ steps.safari_paths.outputs.safari }}
          VAR_ENABLE_MACOS: ${{ vars.ENABLE_MACOS }}
        run: python3 .github/scripts/resolve-release-outputs.py --architectures "${INPUT_ARCHITECTURES:-all}"

  test:
    name: Build gate tests
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: resolve
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: native/go.mod

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Check version sync
        working-directory: src
        run: npm run check:version-sync

      - name: Run unit tests
        working-directory: src
        run: npm run test:unit

      - name: Run integration tests
        working-directory: src
        run: npm run test:integration

      - name: Test Agent Bridge
        working-directory: native
        run: go test ./...

      - name: Test release output resolver
        run: python3 .github/scripts/test_resolve_release_outputs.py

      - name: Test packaging workflow concurrency groups
        run: python3 .github/scripts/test_workflow_concurrency.py

      - name: Assert debug vs non-debug build artifacts
        working-directory: src
        run: npm run test:build-artifacts

  firefox:
    name: Firefox extension
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: [resolve, test]
    if: needs.resolve.outputs.firefox == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Run ESLint
        working-directory: src
        run: npm run lint:js

      - name: Generate browser-specific manifests
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: npm run build:manifests

      - name: Assert packaged Firefox debug artifacts
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: node scripts/assert-debug-artifacts.js --dir .build/firefox --debug="${MARKSNIP_DEBUG}"

      - name: Run web-ext lint (Firefox)
        working-directory: src
        run: node scripts/run-web-ext.js lint -s .build/firefox

      - name: Package Firefox
        working-directory: src/.build/firefox
        run: |
          mkdir -p ../../../dist
          zip -r "../../../dist/marksnip-firefox-${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.artifact_suffix }}.xpi" . -x "*.DS_Store"

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: marksnip-firefox
          path: dist/marksnip-firefox-${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.artifact_suffix }}.xpi
          if-no-files-found: error
          retention-days: 30

  chrome:
    name: Chrome / Edge extensions
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: [resolve, test]
    if: needs.resolve.outputs.chrome == 'true' || needs.resolve.outputs.edge == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Generate browser-specific manifests
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: npm run build:manifests

      - name: Assert packaged Chrome debug artifacts
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: node scripts/assert-debug-artifacts.js --dir .build/chrome --debug="${MARKSNIP_DEBUG}"

      - name: Package Chrome and Edge zips
        working-directory: src/.build/chrome
        env:
          EXT_VERSION: ${{ needs.resolve.outputs.version }}
          ARTIFACT_SUFFIX: ${{ needs.resolve.outputs.artifact_suffix }}
          BUILD_CHROME: ${{ needs.resolve.outputs.chrome }}
          BUILD_EDGE: ${{ needs.resolve.outputs.edge }}
        run: |
          set -euo pipefail
          mkdir -p ../../../dist
          payload="../../../dist/.marksnip-chromium-${EXT_VERSION}${ARTIFACT_SUFFIX}.zip"
          zip -r "$payload" . -x "*.DS_Store"
          if [ "$BUILD_CHROME" = "true" ]; then
            cp "$payload" "../../../dist/marksnip-chrome-${EXT_VERSION}${ARTIFACT_SUFFIX}.zip"
          fi
          if [ "$BUILD_EDGE" = "true" ]; then
            cp "$payload" "../../../dist/marksnip-edge-${EXT_VERSION}${ARTIFACT_SUFFIX}.zip"
          fi
          rm -f "$payload"

      - name: Upload Chrome artifact
        if: needs.resolve.outputs.chrome == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: marksnip-chrome
          path: dist/marksnip-chrome-${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Edge artifact
        if: needs.resolve.outputs.edge == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: marksnip-edge
          path: dist/marksnip-edge-${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 30

  safari:
    name: Safari wrapper
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    needs: [resolve, test]
    if: |
      always() &&
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.test.result == 'success' &&
      needs.resolve.outputs.safari == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Generate Safari web extension sources
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: npm run build:manifests

      - name: Assert packaged Safari debug artifacts
        working-directory: src
        env:
          MARKSNIP_DEBUG: ${{ needs.resolve.outputs.debug }}
        run: node scripts/assert-debug-artifacts.js --dir .build/safari --debug="${MARKSNIP_DEBUG}"

      - name: Build Safari wrapper .app
        env:
          MARKSNIP_ARTIFACT_SUFFIX: ${{ needs.resolve.outputs.artifact_suffix }}
        run: bash xcode/build-safari-app.sh

      - name: Upload Safari artifact
        uses: actions/upload-artifact@v7
        with:
          name: marksnip-safari
          path: dist/marksnip-safari-${{ needs.resolve.outputs.version }}${{ needs.resolve.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 30

  helpers:
    name: Helpers
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: [resolve, test]
    if: needs.resolve.outputs.helper_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.helper_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: native/go.mod

      - name: Build Agent Bridge (${{ matrix.id }})
        working-directory: native
        env:
          GOOS_VAL: ${{ matrix.goos }}
          GOARCH_VAL: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          FMT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          stage="../dist/.agent-bridge-${GOOS_VAL}-${GOARCH_VAL}"
          rm -rf "$stage"
          mkdir -p "$stage"
          cli_name="marksnip"
          host_name="marksnip-native-host"
          if [ "$GOOS_VAL" = "windows" ]; then
            cli_name="${cli_name}.exe"
            host_name="${host_name}.exe"
          fi
          CGO_ENABLED=0 GOOS="$GOOS_VAL" GOARCH="$GOARCH_VAL" go build -o "${stage}/${cli_name}" ./cmd/marksnip
          CGO_ENABLED=0 GOOS="$GOOS_VAL" GOARCH="$GOARCH_VAL" go build -o "${stage}/${host_name}" ./cmd/marksnip-native-host
          cp README.md "${stage}/README.md"
          if [ "$FMT" = "zip" ]; then
            (cd "$stage" && zip -r "../${ARCHIVE}" .)
          else
            (cd "$stage" && tar -czf "../${ARCHIVE}" .)
          fi
          rm -rf "$stage"

      - name: Upload helper artifact (${{ matrix.id }})
        uses: actions/upload-artifact@v7
        with:
          name: marksnip-agent-bridge-${{ matrix.id }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    needs: [resolve, test, firefox, chrome, safari, helpers]
    if: |
      always() &&
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.firefox.result == 'success' || needs.firefox.result == 'skipped') &&
      (needs.chrome.result == 'success' || needs.chrome.result == 'skipped') &&
      (needs.safari.result == 'success' || needs.safari.result == 'skipped') &&
      (needs.helpers.result == 'success' || needs.helpers.result == 'skipped') &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        needs.resolve.outputs.publish_release == 'true'
      )
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: marksnip-*
          merge-multiple: true
          path: ./artifacts

      - name: List artifacts
        run: |
          mkdir -p ./artifacts
          ls -la ./artifacts/ || true

      - name: Get tag name
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            TAG="${{ inputs.version }}"
            if [ -z "$TAG" ]; then
              TAG="v${{ needs.resolve.outputs.version }}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog and install notes
        id: changelog
        env:
          VERSION_TAG: ${{ steps.get-tag.outputs.tag }}
          EXT_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          CHANGELOG_ENTRY="$(awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -n "$CHANGELOG_ENTRY" ]; then
            CHANGELOG_ENTRY="$(printf '%s\n' "$CHANGELOG_ENTRY" | sed '/./,$!d')"
          else
            CHANGELOG_ENTRY="- No changelog entry found for version $VERSION."
          fi

          INSTALL_LINES=""
          if ls ./artifacts/marksnip-chrome-*.zip >/dev/null 2>&1; then
            INSTALL_LINES="${INSTALL_LINES}
          **Chrome:** download \`marksnip-chrome-${EXT_VERSION}.zip\`, load unpacked from \`chrome://extensions/\`.
          "
          fi
          if ls ./artifacts/marksnip-edge-*.zip >/dev/null 2>&1; then
            INSTALL_LINES="${INSTALL_LINES}
          **Edge:** download \`marksnip-edge-${EXT_VERSION}.zip\` (same Chromium package as Chrome), load unpacked from \`edge://extensions/\`.
          "
          fi
          if ls ./artifacts/marksnip-firefox-*.xpi >/dev/null 2>&1; then
            INSTALL_LINES="${INSTALL_LINES}
          **Firefox:** download \`marksnip-firefox-${EXT_VERSION}.xpi\` and open it in Firefox.
          "
          fi
          if ls ./artifacts/marksnip-safari-*.zip >/dev/null 2>&1; then
            INSTALL_LINES="${INSTALL_LINES}
          **Safari:** download \`marksnip-safari-${EXT_VERSION}.zip\` and open \`MarkSnip.app\`, then enable the extension in Safari settings. Unsigned builds need **Safari → Develop → Allow Unsigned Extensions**.
          "
          fi
          if ls ./artifacts/marksnip-agent-bridge-* >/dev/null 2>&1; then
            INSTALL_LINES="${INSTALL_LINES}
          **Agent Bridge:** attach the archive for your OS/arch, extract, then \`install-host\` and enable Agent Bridge in settings.
          "
          fi

          {
            echo "changes<<EOF"
            printf '%s\n' "$CHANGELOG_ENTRY"
            echo "EOF"
            echo "install<<EOF"
            printf '%s\n' "$INSTALL_LINES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: MarkSnip ${{ steps.get-tag.outputs.tag }}
          body: |
            ## MarkSnip ${{ steps.get-tag.outputs.tag }}

            ### Installation
            ${{ steps.changelog.outputs.install }}

            Only artifacts that were enabled and actually built are attached.

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            GitHub-generated notes from PR titles (grouped by `.github/release.yml`) are appended below. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for curated user highlights.
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.xpi
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
