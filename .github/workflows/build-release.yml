# Build and Release Extension
#
# Selectable outputs
# ------------------
# Manual runs (Actions → Build and Release Extension → Run workflow) expose
# boolean inputs for each artifact. Tag pushes (`v*`) do not have those
# inputs; they fall back to repository variables, then to "on":
#
#   Input                  Repo variable           Default
#   ---------------------  ----------------------  -------
#   build_firefox          BUILD_FIREFOX           true
#   build_chrome           BUILD_CHROME            true
#   build_windows_helper   BUILD_WINDOWS_HELPER    true
#   build_linux_helper     BUILD_LINUX_HELPER      true
#   build_macos_helper     BUILD_MACOS_HELPER      true
#
# Set a repo variable to `false` (Settings → Secrets and variables → Actions
# → Variables) to skip that artifact on tag releases without editing YAML.
#
# publish_release: tag pushes always publish. On workflow_dispatch it defaults
# to true to match previous behavior; set it false to build artifacts only.
#
# The Safari / Xcode wrapper under xcode/ is not part of this workflow.

name: Build and Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v4.0.1)"
        required: false
      build_firefox:
        description: "Build Firefox extension (.xpi)"
        type: boolean
        default: true
      build_chrome:
        description: "Build Chrome extension (.zip)"
        type: boolean
        default: true
      build_windows_helper:
        description: "Build Windows Agent Bridge helper (.zip)"
        type: boolean
        default: true
      build_linux_helper:
        description: "Build Linux Agent Bridge helper (.tar.gz)"
        type: boolean
        default: true
      build_macos_helper:
        description: "Build macOS Agent Bridge helpers (darwin amd64 + arm64 .tar.gz)"
        type: boolean
        default: true
      publish_release:
        description: "Create or update the GitHub Release (tag pushes always publish)"
        type: boolean
        default: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: native/go.mod

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Run unit tests
        working-directory: src
        run: npm run test:unit

      - name: Run integration tests
        working-directory: src
        run: npm run test:integration

      - name: Test Agent Bridge
        working-directory: native
        run: go test ./...

  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      firefox: ${{ steps.resolve-outputs.outputs.firefox }}
      chrome: ${{ steps.resolve-outputs.outputs.chrome }}
      windows_helper: ${{ steps.resolve-outputs.outputs.windows_helper }}
      linux_helper: ${{ steps.resolve-outputs.outputs.linux_helper }}
      macos_helper: ${{ steps.resolve-outputs.outputs.macos_helper }}
      any_helper: ${{ steps.resolve-outputs.outputs.any_helper }}
      any_extension: ${{ steps.resolve-outputs.outputs.any_extension }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve enabled build outputs
        id: resolve-outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FIREFOX: ${{ github.event.inputs.build_firefox }}
          INPUT_CHROME: ${{ github.event.inputs.build_chrome }}
          INPUT_WINDOWS: ${{ github.event.inputs.build_windows_helper }}
          INPUT_LINUX: ${{ github.event.inputs.build_linux_helper }}
          INPUT_MACOS: ${{ github.event.inputs.build_macos_helper }}
          VAR_FIREFOX: ${{ vars.BUILD_FIREFOX }}
          VAR_CHROME: ${{ vars.BUILD_CHROME }}
          VAR_WINDOWS: ${{ vars.BUILD_WINDOWS_HELPER }}
          VAR_LINUX: ${{ vars.BUILD_LINUX_HELPER }}
          VAR_MACOS: ${{ vars.BUILD_MACOS_HELPER }}
        run: |
          set -euo pipefail

          to_bool() {
            local raw="${1:-}"
            local fallback="${2}"
            local lowered
            lowered="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
            case "$lowered" in
              true|1|yes|on) echo true ;;
              false|0|no|off) echo false ;;
              *) echo "$fallback" ;;
            esac
          }

          resolve() {
            local input_val="$1"
            local var_val="$2"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              to_bool "$input_val" true
            else
              to_bool "$var_val" true
            fi
          }

          FIREFOX="$(resolve "$INPUT_FIREFOX" "$VAR_FIREFOX")"
          CHROME="$(resolve "$INPUT_CHROME" "$VAR_CHROME")"
          WINDOWS="$(resolve "$INPUT_WINDOWS" "$VAR_WINDOWS")"
          LINUX="$(resolve "$INPUT_LINUX" "$VAR_LINUX")"
          MACOS="$(resolve "$INPUT_MACOS" "$VAR_MACOS")"

          if [ "$FIREFOX" != true ] && [ "$CHROME" != true ] && [ "$WINDOWS" != true ] && [ "$LINUX" != true ] && [ "$MACOS" != true ]; then
            echo "::error::No build outputs are enabled. Turn on at least one of Firefox, Chrome, Windows helper, Linux helper, or macOS helper."
            exit 1
          fi

          ANY_EXTENSION=false
          ANY_HELPER=false
          if [ "$FIREFOX" = true ] || [ "$CHROME" = true ]; then ANY_EXTENSION=true; fi
          if [ "$WINDOWS" = true ] || [ "$LINUX" = true ] || [ "$MACOS" = true ]; then ANY_HELPER=true; fi

          {
            echo "firefox=$FIREFOX"
            echo "chrome=$CHROME"
            echo "windows_helper=$WINDOWS"
            echo "linux_helper=$LINUX"
            echo "macos_helper=$MACOS"
            echo "any_extension=$ANY_EXTENSION"
            echo "any_helper=$ANY_HELPER"
          } >> "$GITHUB_OUTPUT"

          echo "Enabled outputs: firefox=$FIREFOX chrome=$CHROME windows_helper=$WINDOWS linux_helper=$LINUX macos_helper=$MACOS"

      - name: Setup Node.js
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Setup npm
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        run: npm install --global npm@11.8.0

      - name: Show tool versions
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        run: |
          node --version
          npm --version

      - name: Setup Go
        if: steps.resolve-outputs.outputs.any_helper == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: native/go.mod

      - name: Install dependencies
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        working-directory: src
        run: npm ci || npm ci || npm ci

      - name: Run ESLint
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        working-directory: src
        run: npm run lint:js

      - name: Get version from manifest
        id: get-version
        working-directory: src
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

      - name: Generate browser-specific manifests
        if: steps.resolve-outputs.outputs.any_extension == 'true'
        working-directory: src
        run: npm run build:manifests

      - name: Run web-ext lint (Firefox)
        if: steps.resolve-outputs.outputs.firefox == 'true'
        working-directory: src
        run: node scripts/run-web-ext.js lint -s .build/firefox

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Agent Bridge companions
        if: steps.resolve-outputs.outputs.any_helper == 'true'
        working-directory: native
        env:
          BUILD_WINDOWS: ${{ steps.resolve-outputs.outputs.windows_helper }}
          BUILD_LINUX: ${{ steps.resolve-outputs.outputs.linux_helper }}
          BUILD_MACOS: ${{ steps.resolve-outputs.outputs.macos_helper }}
        run: |
          set -euo pipefail
          mkdir -p ../dist

          build_bridge() {
            local goos="$1"
            local goarch="$2"
            local archive_name="$3"
            local stage_dir="../dist/.agent-bridge-${goos}-${goarch}"
            local cli_name="marksnip"
            local host_name="marksnip-native-host"

            rm -rf "$stage_dir"
            mkdir -p "$stage_dir"

            if [ "$goos" = "windows" ]; then
              cli_name="${cli_name}.exe"
              host_name="${host_name}.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o "${stage_dir}/${cli_name}" ./cmd/marksnip
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o "${stage_dir}/${host_name}" ./cmd/marksnip-native-host
            cp README.md "${stage_dir}/README.md"

            if [ "$goos" = "windows" ]; then
              (cd "$stage_dir" && zip -r "../${archive_name}" .)
            else
              (cd "$stage_dir" && tar -czf "../${archive_name}" .)
            fi

            rm -rf "$stage_dir"
          }

          if [ "$BUILD_WINDOWS" = true ]; then
            build_bridge windows amd64 marksnip-agent-bridge-windows-amd64.zip
          fi
          if [ "$BUILD_MACOS" = true ]; then
            build_bridge darwin amd64 marksnip-agent-bridge-macos-amd64.tar.gz
            build_bridge darwin arm64 marksnip-agent-bridge-macos-arm64.tar.gz
          fi
          if [ "$BUILD_LINUX" = true ]; then
            build_bridge linux amd64 marksnip-agent-bridge-linux-amd64.tar.gz
          fi

      - name: Create Chrome package (.zip)
        if: steps.resolve-outputs.outputs.chrome == 'true'
        working-directory: src/.build/chrome
        run: |
          zip -r ../../../dist/marksnip-chrome-${{ steps.get-version.outputs.version }}.zip . \
            -x "*.DS_Store"

      - name: Create Firefox package (.xpi)
        if: steps.resolve-outputs.outputs.firefox == 'true'
        working-directory: src/.build/firefox
        run: |
          zip -r ../../../dist/marksnip-firefox-${{ steps.get-version.outputs.version }}.xpi . \
            -x "*.DS_Store"

      - name: Upload Chrome artifact
        if: steps.resolve-outputs.outputs.chrome == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marksnip-chrome
          path: dist/marksnip-chrome-${{ steps.get-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox artifact
        if: steps.resolve-outputs.outputs.firefox == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marksnip-firefox
          path: dist/marksnip-firefox-${{ steps.get-version.outputs.version }}.xpi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows Agent Bridge artifact
        if: steps.resolve-outputs.outputs.windows_helper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marksnip-agent-bridge-windows
          path: dist/marksnip-agent-bridge-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux Agent Bridge artifact
        if: steps.resolve-outputs.outputs.linux_helper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marksnip-agent-bridge-linux
          path: dist/marksnip-agent-bridge-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS Agent Bridge artifacts
        if: steps.resolve-outputs.outputs.macos_helper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marksnip-agent-bridge-macos
          path: |
            dist/marksnip-agent-bridge-macos-amd64.tar.gz
            dist/marksnip-agent-bridge-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
      )

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Chrome artifact
        if: needs.build.outputs.chrome == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marksnip-chrome
          path: ./artifacts

      - name: Download Firefox artifact
        if: needs.build.outputs.firefox == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marksnip-firefox
          path: ./artifacts

      - name: Download Windows Agent Bridge artifact
        if: needs.build.outputs.windows_helper == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marksnip-agent-bridge-windows
          path: ./artifacts

      - name: Download Linux Agent Bridge artifact
        if: needs.build.outputs.linux_helper == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marksnip-agent-bridge-linux
          path: ./artifacts

      - name: Download macOS Agent Bridge artifacts
        if: needs.build.outputs.macos_helper == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marksnip-agent-bridge-macos
          path: ./artifacts

      - name: List artifacts
        run: |
          mkdir -p ./artifacts
          ls -la ./artifacts/ || true

      - name: Get tag name
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
            if [ -z "$TAG" ]; then
              TAG="v${{ needs.build.outputs.version }}"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        env:
          VERSION_TAG: ${{ steps.get-tag.outputs.tag }}
          BUILD_FIREFOX: ${{ needs.build.outputs.firefox }}
          BUILD_CHROME: ${{ needs.build.outputs.chrome }}
          BUILD_WINDOWS: ${{ needs.build.outputs.windows_helper }}
          BUILD_LINUX: ${{ needs.build.outputs.linux_helper }}
          BUILD_MACOS: ${{ needs.build.outputs.macos_helper }}
          EXT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          VERSION="${VERSION_TAG#v}"

          CHANGELOG_ENTRY="$(awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -n "$CHANGELOG_ENTRY" ]; then
            CHANGELOG_ENTRY="$(printf '%s\n' "$CHANGELOG_ENTRY" | sed '/./,$!d')"
          else
            CHANGELOG_ENTRY="- No changelog entry found for version $VERSION."
          fi

          INSTALL_LINES=""
          if [ "$BUILD_CHROME" = true ]; then
            INSTALL_LINES="${INSTALL_LINES}
          **Chrome:**
          1. Download \`marksnip-chrome-${EXT_VERSION}.zip\`
          2. Go to \`chrome://extensions/\`
          3. Enable \"Developer mode\"
          4. Click \"Load unpacked\" and select the extracted folder
          5. Or drag and drop the .zip file to install
          "
          fi
          if [ "$BUILD_FIREFOX" = true ]; then
            INSTALL_LINES="${INSTALL_LINES}
          **Firefox:**
          1. Download \`marksnip-firefox-${EXT_VERSION}.xpi\`
          2. Open Firefox and drag the .xpi file into the browser
          3. Confirm the installation
          "
          fi
          if [ "$BUILD_WINDOWS" = true ] || [ "$BUILD_LINUX" = true ] || [ "$BUILD_MACOS" = true ]; then
            INSTALL_LINES="${INSTALL_LINES}
          **Agent Bridge (choose the archive for your OS):**
          "
            if [ "$BUILD_WINDOWS" = true ]; then
              INSTALL_LINES="${INSTALL_LINES}- Windows x64: \`marksnip-agent-bridge-windows-amd64.zip\`
          "
            fi
            if [ "$BUILD_MACOS" = true ]; then
              INSTALL_LINES="${INSTALL_LINES}- macOS Intel: \`marksnip-agent-bridge-macos-amd64.tar.gz\`
          - macOS Apple Silicon: \`marksnip-agent-bridge-macos-arm64.tar.gz\`
          "
            fi
            if [ "$BUILD_LINUX" = true ]; then
              INSTALL_LINES="${INSTALL_LINES}- Linux x64: \`marksnip-agent-bridge-linux-amd64.tar.gz\`
          "
            fi
            INSTALL_LINES="${INSTALL_LINES}
          After extracting the archive:
          "
            if [ "$BUILD_WINDOWS" = true ]; then
              INSTALL_LINES="${INSTALL_LINES}- Windows: run \`.\\marksnip.exe install-host\`
          "
            fi
            if [ "$BUILD_LINUX" = true ] || [ "$BUILD_MACOS" = true ]; then
              INSTALL_LINES="${INSTALL_LINES}- macOS/Linux: run \`./marksnip install-host\`
          "
            fi
            INSTALL_LINES="${INSTALL_LINES}- Then enable **Agent Bridge** in the extension settings
          "
          fi

          {
            echo "changes<<EOF"
            printf '%s\n' "$CHANGELOG_ENTRY"
            echo "EOF"
            echo "install<<EOF"
            printf '%s\n' "$INSTALL_LINES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          name: MarkSnip ${{ steps.get-tag.outputs.tag }}
          body: |
            ## MarkSnip ${{ steps.get-tag.outputs.tag }}

            ### Installation
            ${{ steps.changelog.outputs.install }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for all version changes.

          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.xpi
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
