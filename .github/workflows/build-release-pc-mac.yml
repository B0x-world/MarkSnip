name: Build and Release (PC + Mac)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Native host architectures (x64, arm64, or all)"
        type: choice
        options:
          - all
          - x64
          - arm64
        default: all
      enable_macos:
        description: "Mac target: Safari wrapper plus macOS helpers (or set ENABLE_MACOS=true)"
        type: boolean
        default: false
      publish_release:
        description: "Create or update the GitHub Release"
        type: boolean
        default: false

# Caller-only group. The reusable workflow uses a distinct
# build-release-extension-* group so github.workflow in the callee cannot
# collide with this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write
    with:
      architectures: ${{ inputs.architectures }}
      helpers: true
      extensions: true
      mac: ${{ inputs.enable_macos }}
      pc: true
      chrome: true
      edge: true
      firefox: true
      enable_macos: ${{ inputs.enable_macos }}
      publish_release: ${{ inputs.publish_release }}
      debug: false
