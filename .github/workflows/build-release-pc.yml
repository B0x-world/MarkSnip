name: Build and Release (PC)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update the GitHub Release"
        type: boolean
        default: false
      architectures:
        description: "Native host architectures (x64, arm64, or all)"
        type: choice
        options:
          - all
          - x64
          - arm64
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write
    with:
      build_firefox: false
      build_chrome: true
      build_safari: false
      build_windows_amd64: false
      build_windows_arm64: false
      build_linux_amd64: true
      build_linux_arm64: false
      build_macos_amd64: false
      build_macos_arm64: false
      publish_release: ${{ inputs.publish_release }}
      debug: false
      architectures: ${{ inputs.architectures }}
      enable_macos: false
